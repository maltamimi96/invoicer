name: Email Leads Scanner

on:
  # Scheduling moved to Vercel Cron (vercel.json → /api/cron/email-leads,
  # */30) because GitHub Actions' scheduled cron is unreliable — it throttles
  # and silently skips */30 runs. This workflow is kept only for manual
  # on-demand scans from the GitHub UI.
  workflow_dispatch: {}  # manual trigger (bypasses the time-of-day gate via ?force=1)

jobs:
  scan-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify secrets are present
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INVOICER_URL: ${{ secrets.INVOICER_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is missing or empty"
            exit 1
          fi
          if [ -z "$INVOICER_URL" ]; then
            echo "::error::INVOICER_URL repo secret is missing or empty"
            exit 1
          fi
          echo "CRON_SECRET length: ${#CRON_SECRET}"
          echo "INVOICER_URL: $INVOICER_URL"

      - name: Trigger email leads scan
        run: |
          # Manual runs force a scan regardless of the time-of-day cadence gate.
          QS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then QS="?force=1"; fi
          response=$(curl -sf -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.INVOICER_URL }}/api/cron/email-leads${QS}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::warning::Email scan returned $http_code"
            exit 1
          fi
