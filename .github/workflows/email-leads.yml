name: Email Leads Scanner

on:
  schedule:
    # Fire every 30 minutes. The route itself gates the cadence by Sydney
    # local time: twice an hour during the day (6am–8pm), once every two
    # hours overnight (8pm–6am). Off-cadence ticks return immediately.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}  # manual trigger from GitHub UI (bypasses the gate via ?force=1)

jobs:
  scan-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify secrets are present
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INVOICER_URL: ${{ secrets.INVOICER_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is missing or empty"
            exit 1
          fi
          if [ -z "$INVOICER_URL" ]; then
            echo "::error::INVOICER_URL repo secret is missing or empty"
            exit 1
          fi
          echo "CRON_SECRET length: ${#CRON_SECRET}"
          echo "INVOICER_URL: $INVOICER_URL"

      - name: Trigger email leads scan
        run: |
          # Manual runs force a scan regardless of the time-of-day cadence gate.
          QS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then QS="?force=1"; fi
          response=$(curl -sf -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.INVOICER_URL }}/api/cron/email-leads${QS}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::warning::Email scan returned $http_code"
            exit 1
          fi
